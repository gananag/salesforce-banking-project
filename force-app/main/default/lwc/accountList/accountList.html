<template>
    <lightning-card title="Account List" icon-name="standard:account">
        <div slot="actions">
            <lightning-button
                variant="brand"
                label="Create Account"
                icon-name="utility:add"
                onclick={handleOpenCreateModal}
                class="slds-m-left_small">
            </lightning-button>
        </div>

        <div class="slds-m-around_medium">
            <lightning-combobox
                name="industry"
                label="Select Industry"
                value={selectedIndustry}
                options={industryOptions}
                onchange={handleIndustryChange}
                class="slds-m-bottom_medium">
            </lightning-combobox>

            <template if:true={error}>
                <lightning-alert variant="error" title="Error loading accounts">
                    {errorMessage}
                </lightning-alert>
            </template>

            <template if:false={error}>
                <lightning-datatable
                    key-field="Id"
                    data={accounts}
                    columns={columns}
                    onrowaction={handleRowAction}>
                </lightning-datatable>
            </template>
        </div>
    </lightning-card>

    <!-- Create Account Modal -->
    <lightning-modal
        ref="createModal"
        label="Create New Account"
        size="small">
        <div class="slds-m-around_medium">
            <lightning-input
                label="Account Name"
                name="accountName"
                value={createForm.accountName}
                onchange={handleCreateFormChange}
                class="slds-m-bottom_medium"
                placeholder="Enter account name">
            </lightning-input>

            <lightning-combobox
                label="Industry"
                name="industry"
                value={createForm.industry}
                options={industryOptions}
                onchange={handleCreateFormChange}
                class="slds-m-bottom_medium">
            </lightning-combobox>

            <template if:true={createError}>
                <lightning-alert
                    variant="error"
                    title="Error"
                    class="slds-m-bottom_medium">
                    {createError}
                </lightning-alert>
            </template>
        </div>

        <template slot="footer">
            <lightning-button
                variant="neutral"
                label="Cancel"
                onclick={handleCloseCreateModal}>
            </lightning-button>
            <lightning-button
                variant="brand"
                label="Create"
                onclick={handleCreateAccount}
                disabled={isCreating}>
            </lightning-button>
        </template>
    </lightning-modal>

    <!-- Revenue Update Modal -->
    <lightning-modal
        ref="revenueModal"
        label="Update Revenue"
        size="small">
        <div class="slds-m-around_medium">
            <lightning-input
                label="Revenue"
                name="revenue"
                value={revenueForm.revenue}
                onchange={handleRevenueFormChange}
                class="slds-m-bottom_medium"
                placeholder="Enter revenue">
            </lightning-input>

            <template if:true={revenueError}>
                <lightning-alert
                    variant="error"
                    title="Error"
                    class="slds-m-bottom_medium">
                    {revenueError}
                </lightning-alert>
            </template>
        </div>

        <template slot="footer">
            <lightning-button
                variant="neutral"
                label="Cancel"
                onclick={handleCloseRevenueModal}>
            </lightning-button>
            <lightning-button
                variant="brand"
                label="Update"
                onclick={handleUpdateRevenue}
                disabled={isUpdating}>
            </lightning-button>
        </template>
    </lightning-modal>
</template>
